<div class="card">
    <div class="head">
        <span class="line">
            <img src="/cube.svg" alt="icon items">
        </span>
        <p class="id-number">{{ serialCode() }}</p>
    </div>
    <div class="main">
        <p class="name">{{ name() }}</p>
        <p class="status">{{ status() }}</p>
    </div>
    <div class="footer">
        <app-app-btn label="Voir plus"></app-app-btn>
    </div>
</div>
