<div class="card">
    <div class="head">
        <span class="line">
            <img src="/user.svg" alt="icon items">
        </span>
    </div>
    <div class="main">
        <p class="name">{{ name() }}</p>
        <p class="status">{{ email() }}</p>
        <p class="date">{{ dateEnd() }}</p>
        <p class="statu">{{ returned() }}</p>
    </div>
    <div class="footer">
        <app-app-btn label="Voir detail"></app-app-btn>
    </div>
</div>
