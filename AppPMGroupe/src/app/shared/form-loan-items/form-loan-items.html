<form class="form" [formRoot]="FormLoanItemsForm">
  <label for="materiel">Matériel</label>
  <select id="materiel">
    <option value="">Sélectionnez un matériel</option>
    @for (item of this.material.items(); track item.id) {
      <option [value]="item.id" [selected]="item.id">
        {{ item.name }}
      </option>
    }
  </select>

  <label for="nom">Nom</label>
  <input id="nom" [formField]="FormLoanItemsForm.borrower" />

  <label for="materiel">Email</label>
  <input id="materiel" [formField]="FormLoanItemsForm.borrowerEmail" />

  <label for="date">Date de retour</label>
  <input id="date" type="date" [formField]="FormLoanItemsForm.dueDate" />

  <div class="form__actions">
    <button matButton="filled" type="submit">Ajouter</button>
    <button matButton="outlined" type="button" (click)="resetForm()">Effacer</button>
  </div>
</form>
